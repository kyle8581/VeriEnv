[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "browsergym-mind2webonline"
description = "Online-Mind2Web benchmark for BrowserGym"
authors = [
    {name = "OSU NLP Group"},
]
readme = "README.md"
requires-python = ">3.7"
license = {text = "CC-BY-4.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies", "version"]

[project.urls]
homepage = "https://github.com/OSU-NLP-Group/Online-Mind2Web"

[tool.hatch.version]
path = "../core/src/browsergym/core/__init__.py"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/browsergym"]

